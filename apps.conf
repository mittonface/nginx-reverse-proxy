# The single source of truth for everything behind this proxy.
#
# Adding an app means adding one line here. Nothing else in this repo needs to
# change: the nginx config, certificate issuance, health checks, the Makefile
# and the GitHub Actions workflow all read this file.
#
# Columns (whitespace separated):
#   domain       hostname to serve, e.g. foo.mittn.ca
#   upstream     container name and internal port, e.g. my-app-web-1:8080
#                (the container must be attached to the proxy-network network)
#   health_path  path that returns 2xx when the app is healthy, e.g. / or /health
#   flags        comma separated, or - for none:
#                  websocket  proxy WebSocket upgrades and use a 24h read timeout
#                  ratelimit  apply the shared 10r/s limit (burst 20)
#
# For anything a flag does not cover, create nginx/snippets/extra-<domain>.conf;
# it is picked up automatically and included in that domain's server blocks.

# domain               upstream                                      health_path   flags
temps.mittn.ca         house-temp-tracker-web-1:5001                 /             -
camera.mittn.ca        camera-viewer-camera-viewer-1:8080            /health       ratelimit
dragonball.mittn.ca    led-control-server:5005                       /api/status   websocket
jirald.mittn.ca        jirald-mcp-server-jirald-github-app-1:8000    /             websocket
