name: Deploy Nginx Reverse Proxy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render and validate nginx configuration
        # No certificates exist on the runner, so this validates the HTTP-only
        # rendering. The HTTPS rendering is validated on the server at deploy
        # time, where the real certificates live.
        run: ./scripts/generate-config.sh

      - name: Validate docker-compose
        run: docker compose config -q

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "apps.conf,docker-compose.yml,deploy.sh,Makefile,README.md,nginx/nginx.conf,nginx/snippets/*,scripts/*"
          target: "/root/nginx-reverse-proxy"
          strip_components: 0

      - name: Deploy reverse proxy
        uses: appleboy/ssh-action@v0.1.10
        env:
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: LETSENCRYPT_EMAIL
          script: |
            cd /root/nginx-reverse-proxy

            chmod +x deploy.sh scripts/*.sh

            # Files from the pre-manifest layout. Leaving them around is
            # confusing at best: init-letsencrypt.sh no longer matches how
            # certificates are issued, and a stale root nginx.conf is no longer
            # what the proxy mounts.
            rm -f nginx-initial.conf init-letsencrypt.sh nginx.conf \
                  nginx.conf.backup nginx.conf.backup-letsencrypt \
                  ADD_NEW_APP_GUIDE.md .env.example

            docker pull nginx:alpine || true
            docker pull certbot/certbot || true

            export CI=true
            ./deploy.sh

            docker image prune -f --filter "until=24h"

      - name: SSL certificate status
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/nginx-reverse-proxy
            make ssl-status
