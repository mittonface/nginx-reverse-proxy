user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # Docker's embedded DNS. Upstreams are referenced through a variable so they
    # resolve per request rather than being pinned at startup, which means an app
    # container can restart (and change IP) without taking nginx down with it.
    resolver 127.0.0.11 valid=30s;

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # "Connection: upgrade" only when the client actually asked to upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per-app server blocks, rendered from apps.conf by scripts/generate-config.sh.
    # This file itself never changes when apps are added or removed.
    include /etc/nginx/conf.d/*.conf;
}
