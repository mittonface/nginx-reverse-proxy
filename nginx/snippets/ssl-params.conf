# TLS policy, matching certbot's recommended options-ssl-nginx.conf.
#
# This used to be downloaded from the certbot repository at deploy time, which
# broke silently when they moved the file. Keeping it here means the TLS policy
# is reviewable in git and a deploy needs no network access to a third party.
ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# ECDHE only. The DHE fallbacks in certbot's list are what required a
# ssl_dhparam file; every client from the last decade speaks ECDHE.
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
